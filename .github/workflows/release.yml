name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: ./gradlew --no-daemon check :app:assembleRelease -PmoduleVersion=${{ steps.version.outputs.version }}
      # The APK is unsigned on purpose: LSPatch embeds the module as-is and does not check its
      # signature, and an unsigned build is reproducible from the tag.
      - name: Rebuild and compare
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk first.apk
          ./gradlew --no-daemon clean :app:assembleRelease -PmoduleVersion=${{ steps.version.outputs.version }}
          cmp first.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="zalo-xposed-$VERSION.apk"
          cp first.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS \
            --verify-tag \
            --title "zalo-xposed $VERSION" \
            --notes "Unsigned Xposed module APK (libxposed API 102) for embedding into Zalo with LSPatch. SHA-256: $(cut -d' ' -f1 SHA256SUMS)"
