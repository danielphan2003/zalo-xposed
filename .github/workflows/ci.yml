name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Test, lint and build
        run: ./gradlew --no-daemon check :app:assembleRelease
      - name: Checksum
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk zalo-xposed-ci.apk
          sha256sum zalo-xposed-ci.apk | tee zalo-xposed-ci.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zalo-xposed-ci
          path: |
            zalo-xposed-ci.apk
            zalo-xposed-ci.apk.sha256
            app/build/reports/
          if-no-files-found: error
